[project]
name = "python-template"
version = "0.0.0"
description = ""
requires-python = ">=3.15,<3.16"
readme = "README.md"
dependencies = [
  "python-dotenv>=1.1.0",
  "fastapi>=0.115.12",
  "pydantic>=2.11.2",
  "asyncpg>=0.30.0",
  "alembic>=1.15.2",
  "uvicorn>=0.34.0",
  "sqlalchemy[asyncio]>=2.1.9",
]

[dependency-groups]
dev = [
  "ruff>=0.16.1",
  "pre-commit>=4.0.0",
  "poethepoet>=0.40.0"
]

[tool.poe.tasks.migration-generate]
env = { PG_PORT = "15000" }
cmd = "alembic revision --autogenerate"

[tool.poe.tasks.migration-run]
env = { PG_PORT = "15000" }
cmd = "alembic upgrade head"

[tool.uv]
package = false
extra-build-variables = { pyyaml = { PYYAML_FORCE_LIBYAML = "0" } }

[tool.ruff]
target-version = "py315"
extend-exclude = ["migrations"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

[tool.ruff.lint.isort]
split-on-trailing-comma = false
